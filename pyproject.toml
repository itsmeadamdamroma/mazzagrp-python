[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "mazzagrp"
version = "0.1.0"
description = "Python SDK for mazzagrp.com AI APIs — 21 endpoints, x402 USDC micropayments on Base"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "Mazza Group", email = "dev@mazzagrp.com"}]
keywords = ["x402", "usdc", "base", "ai", "scraping", "rag", "embeddings", "micropayments", "web3", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.28",
    "eth-account>=0.10",
    "web3>=6.0",
    "x402>=2.0",
]

[project.urls]
Homepage = "https://mazzagrp.com"
Documentation = "https://mazzagrp.com/apis"
Repository = "https://github.com/itsmeadamdamroma/mazzagrp-python"
Issues = "https://github.com/itsmeadamdamroma/mazzagrp-python/issues"

[tool.setuptools.packages.find]
include = ["mazzagrp*"]
